<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>棋子抽抽樂</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=ZCOOL+KuaiLe&display=swap');

        :root {
            --primary-bg: #0f0c29;
            --gradient-bg: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
            --accent-color: #00d2ff;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
            --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            --ban-color: #ff4b2b;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Serif TC', serif;
            background: var(--gradient-bg);
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 2.5rem;
            margin: 20px 0;
            text-shadow: 0 0 10px var(--accent-color), 0 0 20px var(--accent-color);
            letter-spacing: 2px;
            text-align: center;
        }

        /* --- Music Toggle --- */
        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: var(--glass-bg);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 10px 15px;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.3s;
        }
        .music-btn.playing {
            box-shadow: 0 0 15px var(--accent-color);
            background: rgba(0, 210, 255, 0.2);
        }

        /* --- Stats & Controls --- */
        .header-panel {
            width: 100%;
            max-width: 800px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .stats span {
            color: var(--accent-color);
        }

        .mode-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }

        .mode-toggle:hover {
            background: rgba(0, 0, 0, 0.5);
        }

        .toggle-switch {
            width: 50px;
            height: 24px;
            background: #444;
            border-radius: 12px;
            position: relative;
            transition: 0.3s;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: 0.3s;
        }

        .mode-toggle.active .toggle-switch {
            background: var(--accent-color);
        }

        .mode-toggle.active .toggle-switch::after {
            left: 28px;
        }

        .draw-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 25px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: var(--accent-color);
            color: #000;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.5);
            filter: brightness(1.1);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: #555;
            color: #fff;
            box-shadow: none;
        }

        button.danger {
            background: var(--ban-color);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 75, 43, 0.3);
        }

        .custom-draw {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 5px 15px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
        }

        .custom-draw input {
            width: 60px;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--accent-color);
            color: white;
            text-align: center;
            font-size: 1.1rem;
            outline: none;
        }

        /* --- Stage Area --- */
        #stage {
            width: 100%;
            max-width: 1000px;
            min-height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 50px;
            perspective: 1000px;
        }

        .card {
            width: 180px;
            aspect-ratio: 0.7;
            background: #1a1a1a;
            border-radius: 15px;
            border: 2px solid var(--accent-color);
            overflow: hidden;
            position: relative;
            box-shadow: var(--card-shadow);
            transform-style: preserve-3d;
            animation: cardReveal 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            opacity: 0;
        }

        @keyframes cardReveal {
            0% { transform: translateY(50px) rotateY(90deg); opacity: 0; }
            100% { transform: translateY(0) rotateY(0deg); opacity: 1; }
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
        }

        .card-name {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
            padding: 15px 5px 5px 5px;
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            text-shadow: 0 2px 4px black;
        }

        /* --- Inventory Grid --- */
        .inventory {
            width: 100%;
            max-width: 1000px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid var(--glass-border);
        }

        .inventory-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--glass-border);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 15px;
        }

        .mini-card {
            aspect-ratio: 1;
            background: #222;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #444;
            transition: 0.3s;
            position: relative;
            cursor: pointer;
            user-select: none;
        }

        .mini-card.locked {
            filter: grayscale(1) brightness(0.3);
        }

        .mini-card.unlocked {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }

        .mini-card.banned {
            border-color: var(--ban-color) !important;
            filter: brightness(0.5) contrast(0.8) !important;
        }

        .mini-card.banned::before {
            content: '🚫';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            z-index: 10;
            text-shadow: 0 0 10px black;
        }

        .mini-card:hover {
            transform: scale(1.1);
            z-index: 5;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
        }

        .mini-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
        }

        .mini-card-name {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(0,0,0,0.7);
            font-size: 0.6rem;
            text-align: center;
            padding: 2px;
            display: none;
        }

        .mini-card:hover .mini-card-name {
            display: block;
        }

        .pull-count {
            position: absolute;
            top: 2px;
            right: 2px;
            background: var(--accent-color);
            color: black;
            font-size: 0.6rem;
            font-weight: bold;
            padding: 1px 4px;
            border-radius: 4px;
        }

        /* --- Animations --- */
        .sparkle {
            position: absolute;
            pointer-events: none;
            background: white;
            border-radius: 50%;
            animation: sparkleAnim 1s linear forwards;
        }

        @keyframes sparkleAnim {
            0% { transform: scale(0) rotate(0deg); opacity: 1; }
            100% { transform: scale(1.5) rotate(180deg); opacity: 0; }
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .card { width: 140px; }
            .draw-controls { gap: 10px; }
            button { padding: 10px 15px; font-size: 0.9rem; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); gap: 10px; }
        }
    </style>
</head>
<body>

    <button class="music-btn" id="musicBtn" onclick="toggleMusic()">🎵 音樂: 關</button>

    <h1>棋子抽抽樂</h1>

    <div class="header-panel">
        <div class="stats">
            <div>累積召喚: <span id="totalPulls">0</span></div>
            <div>圖鑑進度: <span id="progress">0</span> / 62</div>
        </div>

        <div class="mode-toggle" id="modeToggle">
            <span>抽獎模式: <strong id="modeText">重複</strong></span>
            <div class="toggle-switch"></div>
            <span style="font-size: 0.8rem; opacity: 0.7;">(不重複模式：抽中即移除，直到重置)</span>
        </div>

        <div class="draw-controls">
            <button onclick="draw(1)">單抽</button>
            <button onclick="draw(10)">十連抽</button>
            <div class="custom-draw">
                <span>自訂:</span>
                <input type="number" id="customCount" value="5" min="0" max="62">
                <button onclick="drawCustom()">抽!</button>
            </div>
            <button class="danger" onclick="fullReset()">全部重置</button>
            <button class="secondary" onclick="resetInventory()">僅重置圖鑑</button>
        </div>
        <div style="text-align: center; font-size: 0.8rem; color: #aaa;">
            小提示：在圖鑑中<strong>雙擊角色</strong>可將其移出/移入抽獎池 (🚫 表示已移出)
        </div>
    </div>

    <div id="stage">
        <div style="opacity: 0.5; font-style: italic;">請選擇抽卡方式開始遊戲...</div>
    </div>

    <div class="inventory">
        <div class="inventory-header">
            <div style="font-size: 1.2rem; font-weight: bold;">角色圖鑑</div>
            <div id="remainingText" style="font-size: 0.9rem; color: var(--accent-color);"></div>
        </div>
        <div class="grid" id="inventoryGrid"></div>
    </div>

    <script>
        // --- AUDIO SYSTEM USING ABSOLUTE URLs ---
        const BASE_URL = "https://file.garden/aWe99vhwaGcNwkok/%E7%A0%B4%E9%A0%AD/";
        
        const bgm = new Audio(BASE_URL + "bgm.mp3");
        bgm.loop = true; bgm.volume = 0.5;
        const se = new Audio(BASE_URL + "se.mp3");

        let isMusicPlaying = false;
        function toggleMusic() {
            const btn = document.getElementById('musicBtn');
            if (isMusicPlaying) {
                bgm.pause(); btn.innerText = "🎵 音樂: 關"; btn.classList.remove('playing');
            } else {
                bgm.play().catch(e => {
                    console.error("Audio block:", e);
                }); 
                btn.innerText = "🎵 音樂: 開"; 
                btn.classList.add('playing');
            }
            isMusicPlaying = !isMusicPlaying;
        }
        function playDrawSFX() { se.currentTime = 0; se.play().catch(e => {}); }

        // --- GAME DATA ---
        const characters = [
            "阿朵菈", "艾薇", "安德烈", "奧吉莉亞", "奧拉", "保羅", "貝文", "彼得", "拿但業", "達利亞", 
            "達太", "多馬", "厄瑞斯", "恩雅", "腓力", "格納季", "公民老師", "哈蘇", "浩瀚花", "韭菜", 
            "卡洛特", "卡繆", "科絲塔", "克里昂", "拉扎爾", "蘭蘭", "朗川", "蕾", "莉莉斯", "林恩", 
            "盧卡斯", "滿目", "蜜拉思", "茉莉", "默茜", "納希瑟斯", "尼奧扎里奧斯", "諾維安", "喬倫娜", "喬諾娜", 
            "喬若娜", "薩利歐", "沈默茜", "索托斯", "提法洛恩", "萬里長城", "薇薇安", "維納托", "西爾維亞", "西門", 
            "小蕾", "小雅各", "星星", "雅各", "伊莉莎白", "猶大", "雨果", "元首", "約翰", "韻華", 
            "AI皇后", "DBA"
        ];

        let state = {
            totalPulls: 0,
            inventory: {}, 
            isRepeatMode: true,
            availablePool: [...characters],
            bannedCharacters: []
        };

        // Load data
        const saved = localStorage.getItem('paperSchoolLottery_v2');
        if (saved) {
            const data = JSON.parse(saved);
            state.totalPulls = data.totalPulls || 0;
            state.inventory = data.inventory || {};
            state.isRepeatMode = data.isRepeatMode !== undefined ? data.isRepeatMode : true;
            state.bannedCharacters = data.bannedCharacters || [];
            
            if (!state.isRepeatMode) {
                state.availablePool = characters.filter(name => !state.inventory[name]);
            }
        }

        const stage = document.getElementById('stage');
        const grid = document.getElementById('inventoryGrid');
        const totalPullsEl = document.getElementById('totalPulls');
        const progressEl = document.getElementById('progress');
        const modeToggle = document.getElementById('modeToggle');
        const modeText = document.getElementById('modeText');
        const remainingText = document.getElementById('remainingText');

        function updateUI() {
            totalPullsEl.innerText = state.totalPulls;
            const collectedCount = Object.keys(state.inventory).length;
            progressEl.innerText = collectedCount;
            
            modeToggle.classList.toggle('active', !state.isRepeatMode);
            modeText.innerText = state.isRepeatMode ? '重複' : '不重複';
            
            const activePoolCount = state.isRepeatMode 
                ? characters.filter(c => !state.bannedCharacters.includes(c)).length
                : state.availablePool.filter(c => !state.bannedCharacters.includes(c)).length;

            if (!state.isRepeatMode) {
                remainingText.innerText = `獎池有效剩餘: ${activePoolCount} / 62`;
            } else {
                remainingText.innerText = `獎池有效人數: ${activePoolCount} / 62`;
            }

            renderInventory();
            saveData();
        }

        function renderInventory() {
            grid.innerHTML = '';
            characters.forEach(name => {
                const count = state.inventory[name] || 0;
                const isBanned = state.bannedCharacters.includes(name);
                const div = document.createElement('div');
                div.className = `mini-card ${count > 0 ? 'unlocked' : 'locked'} ${isBanned ? 'banned' : ''}`;
                
                const img = document.createElement('img');
                // Use absolute URL from File Garden
                img.src = `${BASE_URL}${encodeURIComponent(name)}.png`;
                img.loading = "lazy";
                div.appendChild(img);
                
                const nameTag = document.createElement('div');
                nameTag.className = 'mini-card-name';
                nameTag.innerText = name;
                div.appendChild(nameTag);
                
                if (count > 1) {
                    const badge = document.createElement('div');
                    badge.className = 'pull-count';
                    badge.innerText = `x${count}`;
                    div.appendChild(badge);
                }

                div.ondblclick = (e) => {
                    e.preventDefault();
                    toggleBan(name);
                };
                
                grid.appendChild(div);
            });
        }

        function toggleBan(name) {
            const index = state.bannedCharacters.indexOf(name);
            if (index > -1) {
                state.bannedCharacters.splice(index, 1);
            } else {
                state.bannedCharacters.push(name);
            }
            updateUI();
        }

        function draw(count) {
            if (count <= 0) return;
            
            let pool = state.isRepeatMode ? characters : state.availablePool;
            pool = pool.filter(c => !state.bannedCharacters.includes(c));

            if (pool.length === 0) {
                alert("目前獎池內沒有可抽取的角色！（可能全部被禁用或已抽完）");
                return;
            }

            playDrawSFX();
            stage.innerHTML = '';
            const results = [];
            
            for (let i = 0; i < count; i++) {
                if (pool.length === 0) break;
                
                const index = Math.floor(Math.random() * pool.length);
                const result = pool[index];
                
                results.push(result);
                state.totalPulls++;
                state.inventory[result] = (state.inventory[result] || 0) + 1;
                
                if (!state.isRepeatMode) {
                    const availIdx = state.availablePool.indexOf(result);
                    if (availIdx > -1) state.availablePool.splice(availIdx, 1);
                    pool.splice(index, 1);
                }
            }

            results.forEach((name, i) => {
                setTimeout(() => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    // Use absolute URL from File Garden
                    card.innerHTML = `<img src="${BASE_URL}${encodeURIComponent(name)}.png"><div class="card-name">${name}</div>`;
                    stage.appendChild(card);
                    createSparkles(card);
                }, i * (150 - Math.min(100, count * 2)));
            });

            updateUI();
        }

        function drawCustom() {
            const input = document.getElementById('customCount');
            let val = parseInt(input.value);
            if (isNaN(val) || val < 0) val = 0;
            if (val > 62) val = 62;
            input.value = val;
            draw(val);
        }

        function createSparkles(element) {
            for (let i = 0; i < 10; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                const size = Math.random() * 5 + 2;
                sparkle.style.width = size + 'px'; sparkle.style.height = size + 'px';
                sparkle.style.left = Math.random() * 100 + '%'; sparkle.style.top = Math.random() * 100 + '%';
                sparkle.style.animationDelay = Math.random() * 0.5 + 's';
                element.appendChild(sparkle);
            }
        }

        modeToggle.onclick = () => {
            state.isRepeatMode = !state.isRepeatMode;
            if (!state.isRepeatMode) {
                state.availablePool = characters.filter(name => !state.inventory[name]);
            }
            updateUI();
        };

        function resetInventory() {
            if (confirm("確定要重置圖鑑嗎？（累積召喚次數將保留）")) {
                state.inventory = {};
                state.availablePool = [...characters];
                updateUI();
            }
        }

        function fullReset() {
            if (confirm("⚠️ 注意：這將重置包含「累積召喚次數」在內的所有資料，確定嗎？")) {
                state.totalPulls = 0;
                state.inventory = {};
                state.availablePool = [...characters];
                state.bannedCharacters = [];
                updateUI();
            }
        }

        function saveData() {
            localStorage.setItem('paperSchoolLottery_v2', JSON.stringify({
                totalPulls: state.totalPulls,
                inventory: state.inventory,
                isRepeatMode: state.isRepeatMode,
                bannedCharacters: state.bannedCharacters
            }));
        }

        // Init
        updateUI();
    </script>
</body>
</html>
